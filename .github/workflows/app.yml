name: app

# 用途：日常构建 APK。前提是 app/libs/ 里已经有依赖 aar（由 deps-media3 产出并提交）。
# 触发：push 到 fongmi / main 分支，或手动
# 目标：把反馈循环压到 5-8 分钟

on:
  push:
    branches: [ fongmi, main, ui ]
    paths-ignore:
      - '**.md'
      - 'website/**'
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle 任务（ABI 由 splits 处理，不要写成 leanbackArm64Debug）'
        required: false
        default: ':app:assembleLeanbackDebug'
      artifact_name:
        description: '上传的 artifact 名'
        required: false
        default: 'app-debug'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Python 3.10 (chaquo 需要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ensure Android platform 37
        run: |
          # runner 自带 Android SDK；setup-android@v3 在当前 runner 上会失败
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK = $SDK"
          echo "--- 已有 platforms ---"
          ls "$SDK/platforms" 2>/dev/null || echo "(空)"

          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if ! ls "$SDK/platforms" 2>/dev/null | grep -q "android-37"; then
            echo "安装 android-37 ..."
            yes 2>/dev/null | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-37" 2>&1 | tail -5 \
              || echo "::warning::android-37 装不上，若编译报 compileSdk 缺失再处理"
          else
            echo "android-37 已存在"
          fi
          ls "$SDK/platforms"

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          # 关键：用仓库里固定的 keystore。
          # 原先是「文件不存在就现场生成」，但 Actions 每次都是全新 runner，
          # 于是每次构建都会生成一对新的 RSA 密钥 —— 主题名一样、公钥指纹不同，
          # 装到设备上就会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，无法覆盖安装。
          if [ -f keystore/debug.keystore ]; then
            cp keystore/debug.keystore "$HOME/.android/debug.keystore"
            echo "使用仓库内固定 keystore，签名保持稳定"
          else
            echo "::warning::keystore/debug.keystore 缺失，本次将生成临时签名（后续无法覆盖安装）"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "--- 证书指纹 ---"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -E "SHA1:|SHA256:" | head -2

      - name: Generate local.properties
        run: |
          # 注意：root/build.gradle 用 withInputStream 读这个文件，缺失会直接抛异常
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cat > local.properties <<EOF
          sdk.dir=$SDK
          storeFile=$HOME/.android/debug.keystore
          keyAlias=androiddebugkey
          storePassword=android
          keyPassword=android
          EOF
          echo "--- local.properties ---"
          sed 's/\(Password=\).*/\1***/' local.properties

      - name: Check dependency aars
        run: |
          COUNT=$(ls -1 app/libs/*.aar 2>/dev/null | wc -l)
          echo "app/libs 里有 $COUNT 个 aar"
          ls -lh app/libs/*.aar 2>/dev/null || true
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::app/libs 里没有任何 aar。先跑 deps-media3 workflow，把产物解压进来。"
            exit 1
          fi
          if [ ! -f app/libs/lib-mpvplayer-release.aar ]; then
            echo "::warning::缺 lib-mpvplayer-release.aar，若构建报 verify*MpvNative 失败，见 SETUP.md 的绕过办法"
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: app-gradle-${{ hashFiles('**/*.gradle', 'gradle/libs.versions.toml', 'app/libs/*.aar') }}
          restore-keys: app-gradle-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -x lint \
            ${{ inputs.task || ':app:assembleLeanbackDebug' }}

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/ || true
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::没有产出 APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'app-debug' }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: ver
        run: |
          V=$(grep -oE 'versionName[[:space:]]*"[0-9.]+"' app/build.gradle | head -1 | grep -oE '[0-9.]+' || true)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "app version = $V"

      - name: Publish GitHub Release
        if: steps.ver.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          body: |
            自动构建自 `${{ github.sha }}`

            版本：`${{ steps.ver.outputs.name }}`
            分支：`${{ github.ref_name }}`
          files: out/*.apk
          fail_on_unmatched_files: false
          make_latest: true
